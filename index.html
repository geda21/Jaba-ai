<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jaba AI - Coding Assistant</title>
    
    <!-- Puter.js v2 -->
    <script src="https://js.puter.com/v2/"></script>
    
    <!-- Highlight.js -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f8f9fa;
            --bg-tertiary: #f1f3f5;
            --text-primary: #1a1a2e;
            --text-secondary: #6c757d;
            --border-color: #e9ecef;
            --accent: #6C5CE7;
            --accent-light: #a29bfe;
            --accent-gradient: linear-gradient(135deg, #6C5CE7 0%, #a29bfe 100%);
            --success: #00b894;
            --error: #d63031;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        [data-theme="dark"] {
            --bg-primary: #0f0f1a;
            --bg-secondary: #1a1a2e;
            --bg-tertiary: #16213e;
            --text-primary: #e1e1e6;
            --text-secondary: #a8a8b3;
            --border-color: #2d2d3f;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
        }

        .app {
            display: flex;
            height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-text {
            font-size: 24px;
            font-weight: 700;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .new-chat-btn {
            margin: 16px 20px;
            padding: 12px;
            background: var(--accent-gradient);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            width: calc(100% - 40px);
            transition: transform 0.2s;
        }

        .new-chat-btn:hover {
            transform: translateY(-2px);
        }

        .chat-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .chat-item {
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            margin-bottom: 4px;
            font-size: 14px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .chat-item:hover {
            background: var(--bg-tertiary);
        }

        .chat-item.active {
            background: var(--accent);
            color: white;
        }

        .delete-btn {
            background: none;
            border: none;
            color: inherit;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .chat-item:hover .delete-btn {
            opacity: 0.7;
        }

        /* Main Content */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .top-bar {
            height: 64px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
        }

        .menu-btn, .theme-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 8px;
            border-radius: 8px;
        }

        .menu-btn:hover, .theme-btn:hover {
            background: var(--bg-tertiary);
        }

        .model-badge {
            background: var(--accent-gradient);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
        }

        .welcome {
            text-align: center;
            padding: 60px 20px;
        }

        .welcome h1 {
            font-size: 32px;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .welcome p {
            color: var(--text-secondary);
            margin-bottom: 32px;
        }

        .quick-actions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 12px;
            max-width: 800px;
            margin: 0 auto;
        }

        .quick-action {
            padding: 16px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            cursor: pointer;
            text-align: left;
            transition: all 0.3s;
            color: var(--text-primary);
        }

        .quick-action:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }

        .quick-action .icon {
            font-size: 24px;
            margin-bottom: 8px;
        }

        /* Messages */
        .messages {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .message {
            display: flex;
            gap: 12px;
            max-width: 85%;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-weight: 700;
        }

        .bot .avatar {
            background: var(--accent-gradient);
            color: white;
        }

        .user .avatar {
            background: var(--bg-tertiary);
        }

        .content {
            padding: 16px;
            border-radius: 16px;
            line-height: 1.6;
            font-size: 14px;
        }

        .bot .content {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-top-left-radius: 4px;
        }

        .user .content {
            background: var(--accent-gradient);
            color: white;
            border-top-right-radius: 4px;
        }

        .content pre {
            background: #1e1e2e !important;
            padding: 16px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 12px 0;
            position: relative;
        }

        .content code {
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
        }

        .copy-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(255,255,255,0.1);
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .content pre:hover .copy-btn {
            opacity: 1;
        }

        /* Typing indicator */
        .typing {
            display: flex;
            gap: 4px;
            padding: 8px 0;
        }

        .typing span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent);
            animation: bounce 1.4s infinite;
            opacity: 0.4;
        }

        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-10px); opacity: 1; }
        }

        /* Input Area */
        .input-area {
            padding: 16px 24px 24px;
            border-top: 1px solid var(--border-color);
        }

        .input-wrapper {
            display: flex;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 8px 12px;
            transition: border-color 0.3s;
        }

        .input-wrapper:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.1);
        }

        textarea {
            flex: 1;
            border: none;
            background: none;
            resize: none;
            padding: 8px;
            font-family: inherit;
            font-size: 15px;
            color: var(--text-primary);
            outline: none;
            line-height: 1.5;
            max-height: 200px;
        }

        textarea::placeholder {
            color: var(--text-secondary);
        }

        .send-btn {
            background: var(--accent-gradient);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 8px 16px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .send-btn:hover:not(:disabled) {
            transform: translateY(-2px);
        }

        .send-btn:disabled {
            opacity: 0.5;
        }

        .char-count {
            font-size: 12px;
            color: var(--text-secondary);
            margin-right: 8px;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            padding: 16px 24px;
            border-radius: 12px;
            box-shadow: var(--shadow);
            transform: translateX(120%);
            transition: transform 0.3s;
            z-index: 1000;
        }

        .toast.show {
            transform: translateX(0);
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 3px;
        }

        /* Mobile */
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                left: 0;
                top: 0;
                height: 100%;
                transform: translateX(-100%);
                z-index: 100;
                box-shadow: var(--shadow);
            }
            
            .sidebar.open {
                transform: translateX(0);
            }
            
            .message {
                max-width: 95%;
            }
            
            .quick-actions {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- Sidebar -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <span style="font-size: 28px;">🧠</span>
                    <span class="logo-text">Jaba AI</span>
                </div>
            </div>
            <button class="new-chat-btn" onclick="newChat()">
                + New Chat
            </button>
            <div class="chat-list" id="chatList"></div>
            <div style="padding: 16px; border-top: 1px solid var(--border-color);">
                <button onclick="clearAll()" style="width: 100%; padding: 8px; background: none; border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-secondary); cursor: pointer;">
                    Clear All Chats
                </button>
            </div>
        </div>

        <!-- Main -->
        <div class="main">
            <div class="top-bar">
                <div style="display: flex; align-items: center; gap: 16px;">
                    <button class="menu-btn" onclick="toggleSidebar()">☰</button>
                    <span style="font-weight: 600;" id="chatTitle">Jaba AI</span>
                </div>
                <div style="display: flex; align-items: center; gap: 16px;">
                    <span class="model-badge">Kimi K3</span>
                    <button class="theme-btn" onclick="toggleTheme()">🌓</button>
                </div>
            </div>

            <div class="chat-area" id="chatArea">
                <div class="welcome" id="welcomeScreen">
                    <h1>Welcome to Jaba AI</h1>
                    <p>Your intelligent coding companion powered by Kimi K3</p>
                    <div class="quick-actions">
                        <div class="quick-action" onclick="quickAsk('Explain async/await in JavaScript with examples')">
                            <div class="icon">⚡</div>
                            <strong>Async/Await</strong>
                            <p style="font-size: 12px; color: var(--text-secondary); margin-top: 4px;">JavaScript concepts explained</p>
                        </div>
                        <div class="quick-action" onclick="quickAsk('Write a Python function to sort a list of dictionaries')">
                            <div class="icon">🐍</div>
                            <strong>Python Sorting</strong>
                            <p style="font-size: 12px; color: var(--text-secondary); margin-top: 4px;">Data manipulation</p>
                        </div>
                        <div class="quick-action" onclick="quickAsk('Debug: TypeError: Cannot read property map of undefined')">
                            <div class="icon">🐛</div>
                            <strong>Debug Help</strong>
                            <p style="font-size: 12px; color: var(--text-secondary); margin-top: 4px;">Error resolution</p>
                        </div>
                        <div class="quick-action" onclick="quickAsk('Create a React component with TypeScript')">
                            <div class="icon">⚛️</div>
                            <strong>React + TypeScript</strong>
                            <p style="font-size: 12px; color: var(--text-secondary); margin-top: 4px;">Component creation</p>
                        </div>
                    </div>
                </div>
                <div class="messages" id="messages"></div>
            </div>

            <div class="input-area">
                <div class="input-wrapper">
                    <textarea id="userInput" placeholder="Ask anything about coding..." rows="1" onkeydown="handleKeyDown(event)" oninput="updateCharCount()"></textarea>
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <span class="char-count" id="charCount">0/4000</span>
                        <button class="send-btn" id="sendBtn" onclick="sendMessage()">
                            ➤
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <script>
        // App State
        let chats = JSON.parse(localStorage.getItem('jaba-chats') || '[]');
        let currentChatId = null;
        let isProcessing = false;
        let theme = localStorage.getItem('jaba-theme') || 'light';

        // Initialize
        function init() {
            document.documentElement.setAttribute('data-theme', theme);
            loadChats();
            if (chats.length > 0) {
                switchChat(chats[0].id);
            }
        }

        // Chat Management
        function newChat() {
            const chat = {
                id: Date.now().toString(),
                title: 'New Chat',
                messages: [],
                createdAt: new Date().toISOString()
            };
            chats.unshift(chat);
            saveChats();
            switchChat(chat.id);
            updateChatList();
        }

        function switchChat(chatId) {
            currentChatId = chatId;
            const chat = chats.find(c => c.id === chatId);
            if (!chat) return;

            document.getElementById('chatTitle').textContent = chat.title;
            document.getElementById('welcomeScreen').style.display = 'none';
            
            const messagesDiv = document.getElementById('messages');
            messagesDiv.innerHTML = '';
            
            chat.messages.forEach(msg => {
                renderMessage(msg.role, msg.content);
            });
            
            updateChatList();
            scrollToBottom();
        }

        function deleteChat(chatId) {
            if (!confirm('Delete this chat?')) return;
            chats = chats.filter(c => c.id !== chatId);
            if (currentChatId === chatId) {
                currentChatId = chats.length > 0 ? chats[0].id : null;
                if (currentChatId) {
                    switchChat(currentChatId);
                } else {
                    document.getElementById('messages').innerHTML = '';
                    document.getElementById('welcomeScreen').style.display = '';
                    document.getElementById('chatTitle').textContent = 'Jaba AI';
                }
            }
            saveChats();
            updateChatList();
        }

        function clearAll() {
            if (!confirm('Delete all chats?')) return;
            chats = [];
            currentChatId = null;
            saveChats();
            document.getElementById('messages').innerHTML = '';
            document.getElementById('welcomeScreen').style.display = '';
            document.getElementById('chatTitle').textContent = 'Jaba AI';
            updateChatList();
        }

        function updateChatList() {
            const chatList = document.getElementById('chatList');
            chatList.innerHTML = chats.map(chat => `
                <div class="chat-item ${chat.id === currentChatId ? 'active' : ''}" 
                     onclick="switchChat('${chat.id}')">
                    <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1;">
                        💬 ${chat.title}
                    </span>
                    <button class="delete-btn" onclick="event.stopPropagation(); deleteChat('${chat.id}')">🗑️</button>
                </div>
            `).join('');
        }

        function loadChats() {
            updateChatList();
        }

        function saveChats() {
            localStorage.setItem('jaba-chats', JSON.stringify(chats));
        }

        // Message Handling
        async function sendMessage() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();
            if (!message || isProcessing) return;

            if (!currentChatId) {
                newChat();
            }

            isProcessing = true;
            document.getElementById('sendBtn').disabled = true;
            input.value = '';
            input.style.height = 'auto';
            updateCharCount();

            document.getElementById('welcomeScreen').style.display = 'none';

            // Add user message
            addMessage('user', message);

            // Show typing indicator
            const typingId = showTyping();

            try {
                const response = await puter.ai.chat(message, {
                    model: 'moonshotai/kimi-k3',
                    systemPrompt: 'You are Jaba AI, an expert coding assistant. Provide clear, well-commented code examples. Use markdown for formatting.',
                    temperature: 0.7,
                    maxTokens: 4000
                });

                removeTyping(typingId);
                const responseText = typeof response === 'string' ? response : response.message?.content || JSON.stringify(response);
                addMessage('bot', responseText);
                showToast('✅ Message sent');
            } catch (error) {
                removeTyping(typingId);
                console.error('Error:', error);
                addMessage('bot', '❌ Error: ' + error.message + '. Please try again.');
                showToast('❌ Failed to send');
            } finally {
                isProcessing = false;
                document.getElementById('sendBtn').disabled = false;
                input.focus();
            }
        }

        function quickAsk(prompt) {
            document.getElementById('userInput').value = prompt;
            sendMessage();
        }

        function addMessage(role, content) {
            const chat = chats.find(c => c.id === currentChatId);
            if (!chat) return;

            chat.messages.push({ role, content, timestamp: new Date().toISOString() });
            
            if (role === 'user' && chat.messages.filter(m => m.role === 'user').length === 1) {
                chat.title = content.substring(0, 50) + (content.length > 50 ? '...' : '');
                document.getElementById('chatTitle').textContent = chat.title;
            }
            
            saveChats();
            renderMessage(role, content);
            updateChatList();
            scrollToBottom();
        }

        function renderMessage(role, content) {
            const messagesDiv = document.getElementById('messages');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${role}`;
            
            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            avatar.textContent = role === 'bot' ? 'J' : '👤';
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'content';
            
            if (role === 'bot') {
                contentDiv.innerHTML = marked.parse(content);
                // Add copy buttons to code blocks
                contentDiv.querySelectorAll('pre').forEach(pre => {
                    const btn = document.createElement('button');
                    btn.className = 'copy-btn';
                    btn.textContent = 'Copy';
                    btn.onclick = () => {
                        const code = pre.querySelector('code').textContent;
                        navigator.clipboard.writeText(code).then(() => {
                            btn.textContent = 'Copied!';
                            setTimeout(() => btn.textContent = 'Copy', 2000);
                        });
                    };
                    pre.style.position = 'relative';
                    pre.appendChild(btn);
                });
                // Highlight code
                contentDiv.querySelectorAll('pre code').forEach(block => {
                    hljs.highlightElement(block);
                });
            } else {
                contentDiv.textContent = content;
            }
            
            msgDiv.appendChild(avatar);
            msgDiv.appendChild(contentDiv);
            messagesDiv.appendChild(msgDiv);
        }

        function showTyping() {
            const id = 'typing-' + Date.now();
            const messagesDiv = document.getElementById('messages');
            const typingDiv = document.createElement('div');
            typingDiv.id = id;
            typingDiv.className = 'message bot';
            typingDiv.innerHTML = `
                <div class="avatar">J</div>
                <div class="content">
                    <div class="typing">
                        <span></span><span></span><span></span>
                    </div>
                </div>
            `;
            messagesDiv.appendChild(typingDiv);
            scrollToBottom();
            return id;
        }

        function removeTyping(id) {
            const element = document.getElementById(id);
            if (element) element.remove();
        }

        // UI Helpers
        function handleKeyDown(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        function updateCharCount() {
            const length = document.getElementById('userInput').value.length;
            document.getElementById('charCount').textContent = length + '/4000';
            // Auto-resize
            const textarea = document.getElementById('userInput');
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(textarea.scrollHeight, 200) + 'px';
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        function toggleTheme() {
            theme = theme === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('jaba-theme', theme);
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function scrollToBottom() {
            setTimeout(() => {
                const chatArea = document.getElementById('chatArea');
                chatArea.scrollTop = chatArea.scrollHeight;
            }, 100);
        }

        // Start the app
        init();
    </script>
</body>
      </html>
